# controller_manager configuration shared by BOTH robot instances of the
# haptic pair (leader and follower). Each instance loads this file under
# its own ROS namespace (see fivebar_2dof.urdf.xacro's robot_namespace /
# controller_params_file args and launch/haptic_pair.launch.py), so the
# same joint names (motor_1/motor_2) and controller name are reused without
# collision -- each namespace gets its own controller_manager node.
#
# Top-level keys use the "/**" wildcard rather than bare node names:
# controller_manager only matches a node's YAML parameters if the key is
# either the fully-qualified node name or this wildcard -- a bare
# "controller_manager:" key only matches a node in the root namespace, and
# would silently fail to apply (no controller "type" found) once the node
# is namespaced to /leader or /follower.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      motkin_five_bar_force_velocity_controller:
        type: motkin_five_bar_force_velocity_controller/MotkinFiveBarForceVelocityController

  motkin_five_bar_force_velocity_controller:
    ros__parameters:
      motor_left_joint: motor_1
      motor_right_joint: motor_2
      contact_force_topic: ~/contact_force
      gain_kd: 0.05
      max_joint_velocity: 2.0
      # Disabled since the five-bar was switched to the MOTKINBENCH CAD:
      # that mechanism's plane is the (x,y) plane of `case`, with both motor
      # axes vertical, so with the base plate flat on the ground gravity is
      # perpendicular to the plane and exerts no torque on motor_1/motor_2.
      # Re-enable only if the testbed is remounted in a vertical plane, and
      # then revisit gravity_torque(): it assumes the coupler centre of mass
      # sits exactly at the elbow, which no longer holds (arm_l2's inertial
      # origin is (0.0487, 0, -0.002) in its own frame, not the origin).
      gravity_compensation_enabled: false
