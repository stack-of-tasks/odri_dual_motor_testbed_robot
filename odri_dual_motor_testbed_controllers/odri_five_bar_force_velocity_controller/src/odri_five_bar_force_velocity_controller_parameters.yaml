odri_five_bar_force_velocity_controller:
  motor_left_joint: {
    type: string,
    default_value: "motor_1",
    description: "Name of the left actuated joint (theta1) of the five-bar.",
    read_only: true,
  }
  motor_right_joint: {
    type: string,
    default_value: "motor_2",
    description: "Name of the right actuated joint (theta2) of the five-bar.",
    read_only: true,
  }
  contact_force_topic: {
    type: string,
    default_value: "~/contact_force",
    description: "geometry_msgs/WrenchStamped topic providing the contact force f_c = (fx, fy) at the closing point, expressed in the (x, y) plane of case.",
    read_only: true,
  }
  gain_kp: {
    type: double,
    default_value: 0.0,
    description: "Position gain sent to the hardware alongside the velocity command (position setpoint is held at the measured position each cycle, so this only acts as an anti-drift term).",
  }
  gain_kd: {
    type: double,
    default_value: 0.05,
    description: "Velocity gain sent to the hardware; this is the gain that actually turns the commanded qdot = J^T f_c into torque on the real/simulated joints.",
  }
  max_joint_velocity: {
    type: double,
    default_value: 2.0,
    description: "Safety clamp (rad/s) applied to each component of qdot before it is sent to the hardware.",
  }
  gravity_compensation_enabled: {
    type: bool,
    default_value: false,
    description: "If true, the effort command is set to the analytical gravity-compensation feed-forward torque (see five_bar_kinematics.hpp GravityTorque). If false, effort is sent as an explicit 0.0. Defaults to false since the MOTKINBENCH five-bar moves in a horizontal plane (both motor axes vertical), where gravity produces no in-plane torque; GravityTorque also assumes the coupler centre of mass sits at the elbow, which is no longer true of this CAD.",
  }
  gravity: {
    type: double,
    default_value: 9.81,
    description: "Gravitational acceleration (m/s^2) used by the gravity-compensation feed-forward.",
  }
  coupler_mass_left: {
    type: double,
    default_value: 0.00836663,
    description: "Mass (kg) of the arm_l2 coupler link, from the URDF -- used for the gravity feed-forward on motor_1 when gravity_compensation_enabled.",
  }
  coupler_mass_right: {
    type: double,
    default_value: 0.00968954,
    description: "Mass (kg) of the arm_r2 coupler link, from the URDF -- used for the gravity feed-forward on motor_2 when gravity_compensation_enabled.",
  }
  geometry:
    a_x: { type: double, default_value: -0.0421006, description: "x coordinate of the motor_1 axis A in the case (x,y) plane, from the URDF." }
    a_z: { type: double, default_value: 0.0302628, description: "Second in-plane coordinate (y, despite the historical name) of the motor_1 axis A in the case (x,y) plane, from the URDF." }
    b_x: { type: double, default_value: 0.0578994, description: "x coordinate of the motor_2 axis B in the case (x,y) plane, from the URDF." }
    b_z: { type: double, default_value: 0.0302628, description: "Second in-plane coordinate (y, despite the historical name) of the motor_2 axis B in the case (x,y) plane, from the URDF." }
    l1: { type: double, default_value: 0.06, description: "Crank length (motor -> elbow), from the URDF." }
    l2: { type: double, default_value: 0.1, description: "Coupler length (elbow -> closing point), from the URDF." }
    phi1: { type: double, default_value: 1.5707963267948966, description: "Angular offset of the left crank, from the URDF." }
    phi2: { type: double, default_value: 1.5707963267948966, description: "Angular offset of the right crank, from the URDF." }
